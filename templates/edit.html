<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Expense</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="topbar">
        <h1>✏️ Edit Expense</h1>
    </header>

    <main class="container narrow">
        <section class="card">
            <form method="POST" class="form-grid" style="grid-template-columns: 1fr;">
                <input type="number" step="0.01" name="amount" value="{{ e['amount'] }}" required>
                <input type="text" name="category" value="{{ e['category'] }}" required>
                <input type="date" name="date" value="{{ e['date'] }}" required>
                <input type="text" name="note" value="{{ e['note'] }}">
                <button type="submit" class="btn">Save Changes</button>
                <a href="/" class="btn btn-light" style="text-align:center;">Cancel</a>
            </form>
        </section>
    </main>
</body>
</html>
